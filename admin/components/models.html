<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
  <div class="flex items-center justify-between mb-5">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Device Models</h2>
      <p class="text-sm text-slate-500 mt-1">Quản lý model thiết bị, CPU, màn hình, hệ điều hành.</p>
    </div>
    <button onclick="openModelForm()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl">
      + Add Model
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-slate-200 text-slate-600">
          <th class="text-left py-3">ID</th>
          <th class="text-left py-3">Model</th>
          <th class="text-left py-3">Brand</th>
          <th class="text-left py-3">CPU</th>
          <th class="text-left py-3">Screen</th>
          <th class="text-left py-3">OS</th>
          <th class="text-left py-3">Status</th>
          <th class="text-left py-3">Actions</th>
        </tr>
      </thead>
      <tbody id="modelTable"></tbody>
    </table>
  </div>

  <div id="modelFormBox" class="hidden mt-6 border border-slate-200 rounded-2xl p-5 bg-slate-50">
    <h3 class="text-lg font-semibold mb-4" id="modelFormTitle">Add Model</h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input id="modelName" type="text" placeholder="Tên model" class="border border-slate-300 rounded-xl px-4 py-2">
      <input id="modelBrand" type="text" placeholder="Hãng" class="border border-slate-300 rounded-xl px-4 py-2">
      <input id="modelCpu" type="text" placeholder="CPU" class="border border-slate-300 rounded-xl px-4 py-2">
      <input id="modelScreen" type="text" placeholder="Màn hình" class="border border-slate-300 rounded-xl px-4 py-2">
      <input id="modelOs" type="text" placeholder="Hệ điều hành" class="border border-slate-300 rounded-xl px-4 py-2">
    </div>

    <div class="flex gap-3 mt-5">
      <button onclick="saveModel()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl">
        Save
      </button>
      <button onclick="closeModelForm()" class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-xl">
        Cancel
      </button>
    </div>
  </div>
</div>
