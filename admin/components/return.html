<div class="space-y-8 animate-in fade-in duration-700 mt-10">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
        <div>
            <h2 class="text-2xl font-bold text-slate-800">Quản lý Đổi trả hàng</h2>
            <p class="text-sm text-slate-500">Xử lý yêu cầu hoàn tiền và nghiệp vụ kho hàng</p>
        </div>
        
        <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="Tìm mã đơn, tên khách..." 
                    class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-64"
                    oninput="handleFilterChange()">
            </div>
            <select id="status-filter" onchange="handleFilterChange()"
                class="bg-white border border-slate-200 text-slate-600 text-sm rounded-lg p-2.5 outline-none font-medium">
                <option value="all">Tất cả trạng thái</option>
                <option value="pending">Chờ kiểm định</option>
                <option value="shipping">Đang gửi hàng</option>
                <option value="completed">Đã hoàn tất</option>
                <option value="rejected">Bị từ chối</option>
            </select>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="glass-card p-4 rounded-xl border border-amber-100 bg-amber-50/30">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-amber-100 text-amber-600 rounded-lg"><i data-lucide="clock" class="w-5 h-5"></i></div>
                <div><p class="text-xs text-slate-500 font-bold uppercase">Chờ xử lý</p><h3 id="count-pending" class="text-xl font-bold">0 đơn</h3></div>
            </div>
        </div>
        <div class="glass-card p-4 rounded-xl border border-emerald-100 bg-emerald-50/30">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-emerald-100 text-emerald-600 rounded-lg"><i data-lucide="check-circle" class="w-5 h-5"></i></div>
                <div><p class="text-xs text-slate-500 font-bold uppercase">Hoàn tất</p><h3 id="count-completed" class="text-xl font-bold">0 đơn</h3></div>
            </div>
        </div>
        <div class="glass-card p-4 rounded-xl border border-rose-100 bg-rose-50/30">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-rose-100 text-rose-600 rounded-lg"><i data-lucide="x-octagon" class="w-5 h-5"></i></div>
                <div><p class="text-xs text-slate-500 font-bold uppercase">Từ chối</p><h3 id="count-rejected" class="text-xl font-bold">0 đơn</h3></div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-slate-500 text-xs uppercase font-bold">
                    <tr>
                        <th class="px-6 py-4">Mã đơn / Khách</th>
                        <th class="px-6 py-4">Giá trị</th>
                        <th class="px-6 py-4">Sản phẩm</th>
                        <th class="px-6 py-4">Lý do</th>
                        <th class="px-6 py-4">Trạng thái</th>
                        <th class="px-6 py-4 text-right">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="return-table-body" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="return-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden">
        <div class="p-6 border-b flex justify-between items-center bg-slate-50">
            <h3 class="text-xl font-bold text-slate-800" id="modal-title"></h3>
            <button onclick="closeModal()" class="p-2 hover:bg-slate-200 rounded-full text-slate-400"><i data-lucide="x"></i></button>
        </div>
        <div class="p-8 space-y-6">
            <div class="grid grid-cols-2 gap-6">
                <div><label class="text-xs font-bold text-slate-400 uppercase">Khách hàng</label><p id="modal-customer" class="font-bold text-slate-700"></p></div>
                <div><label class="text-xs font-bold text-slate-400 uppercase">Số tiền hoàn trả</label><p id="modal-price" class="font-bold text-blue-600"></p></div>
            </div>
            <div><label class="text-xs font-bold text-slate-400 uppercase">Sản phẩm</label><p id="modal-product" class="text-slate-700"></p></div>
            <div class="p-4 bg-amber-50 border border-amber-100 rounded-xl">
                <label class="text-xs font-bold text-amber-600 uppercase">Mô tả lỗi từ khách</label>
                <p id="modal-reason" class="text-sm italic text-slate-700 mt-1"></p>
            </div>
        </div>
        <div id="modal-footer" class="p-6 border-t bg-slate-50 flex gap-3 justify-end"></div>
    </div>
</div>
