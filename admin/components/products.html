<div class="space-y-6 animate-in slide-in-from-right duration-500">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-slate-800">Kho hàng thiết bị</h2>
            <p class="text-sm text-slate-500">Quản lý kho máy tính, điện thoại và linh kiện</p>
        </div>
        <button onclick="Utils.toggleModal('add-product-modal')" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl flex items-center gap-2 hover:bg-blue-700 transition shadow-lg shadow-blue-100 font-bold active:scale-95">
            <i data-lucide="plus-circle" class="w-5 h-5"></i> Thêm thiết bị mới
        </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-bold tracking-widest border-b border-slate-200">
                    <th class="px-6 py-5">Tên thiết bị</th>
                    <th class="px-6 py-5">Phân loại</th>
                    <th class="px-6 py-5">Giá bán</th>
                    <th class="px-6 py-5">Số lượng</th>
                    <th class="px-6 py-5 text-right">Hành động</th>
                </tr>
            </thead>
            <tbody id="product-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
        
        <div id="product-loading" class="hidden py-12 text-center">
            <div class="ai-loading mb-2"></div>
            <p class="text-xs text-slate-400">Đang truy xuất kho hàng...</p>
        </div>
    </div>

    <div id="add-product-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-xl w-full p-8 shadow-2xl animate-in zoom-in-95 duration-300">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="text-xl font-bold">Nhập thiết bị mới</h3>
                <button onclick="Utils.toggleModal('add-product-modal')" class="text-slate-400"><i data-lucide="x"></i></button>
            </div>

            <form id="add-product-form" class="space-y-4">
                <div class="flex flex-col items-center justify-center p-4 border-2 border-dashed rounded-2xl bg-slate-50 cursor-pointer" onclick="document.getElementById('p-image-input').click()">
                    <input type="file" id="p-image-input" hidden accept="image/*" onchange="InventoryModule.previewImage(event)">
                    <div id="image-preview-placeholder" class="text-center">
                        <i data-lucide="image-plus" class="w-8 h-8 text-slate-300 mx-auto"></i>
                        <p class="text-[10px] text-slate-400">Tải ảnh thiết bị</p>
                    </div>
                    <img id="image-preview-display" class="hidden w-full h-32 object-cover rounded-xl">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400">Tên sản phẩm</label>
                        <input type="text" id="p-name" required class="w-full border p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-400">Danh mục</label>
                        <select id="p-category" class="w-full border p-3 rounded-xl text-sm bg-white">
                            <option>Laptop & PC</option>
                            <option>Điện thoại</option>
                            <option>Linh kiện</option>
                            <option>Âm thanh</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-400">Số lượng</label>
                        <input type="number" id="p-stock" required class="w-full border p-3 rounded-xl text-sm">
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400">Giá bán (VNĐ)</label>
                        <input type="number" id="p-price" required class="w-full border p-3 rounded-xl text-sm">
                    </div>
                </div>

                <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-blue-600 transition shadow-lg active:scale-95">
                    Xác nhận nhập kho
                </button>
            </form>
        </div>
    </div>
</div>
