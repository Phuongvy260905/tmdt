<div class="space-y-8 animate-in slide-in-from-right duration-500">
    <!-- Tiêu đề chung -->
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-slate-800">Marketing Công Nghệ ✨</h2>
    </div>

    <!-- Grid container chính: 2 cột ngang nhau -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Phần 1: AI Soạn Email Marketing -->
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-3 mb-6">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-2xl">
                    <i data-lucide="mail"></i>
                </div>
                <h3 class="font-bold text-lg">✨ AI Soạn Email Marketing</h3>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Sản phẩm chủ đạo</label>
                    <input
                        type="text"
                        id="email-product-name"
                        placeholder="Ví dụ: MacBook Air M3 2024..."
                        class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                    />
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Nhóm khách hàng mục tiêu</label>
                    <select
                        id="email-target"
                        class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                    >
                        <option value="khách hàng đam mê công nghệ">Tech Enthusiasts (Người yêu công nghệ)</option>
                        <option value="sinh viên và nhân viên văn phòng">Office & Students (Sinh viên / Văn phòng)</option>
                        <option value="game thủ chuyên nghiệp">Professional Gamers (Game thủ)</option>
                        <option value="người dùng cao cấp">Premium Users (Khách hàng cao cấp)</option>
                    </select>
                </div>
                <button
                    onclick="handleGenerateEmail()"
                    id="gen-email-btn"
                    class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold hover:bg-slate-800 transition-all active:scale-[0.98]"
                >
                    <i data-lucide="wand-2" class="w-4 h-4 inline-block mr-2"></i> Soạn email AI
                </button>
            </div>
            <div
                id="email-result"
                class="mt-6 p-5 bg-slate-50 rounded-2xl hidden text-sm whitespace-pre-line border border-slate-100 leading-relaxed shadow-inner"
            ></div>
        </div>

        <!-- Phần 2: AI Chiến Lược Marketing -->
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-3 mb-6">
                <div class="p-3 bg-indigo-100 text-indigo-600 rounded-2xl">
                    <i data-lucide="zap"></i>
                </div>
                <h3 class="font-bold text-lg">✨ AI Chiến Lược Marketing</h3>
            </div>

            <div class="space-y-5 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Tên sản phẩm / Model</label>
                    <input
                        type="text"
                        id="strategy-product-name"
                        placeholder="Ví dụ: iPhone 15 Pro Max 256GB Titanium"
                        class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                    />
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Nhóm khách hàng mục tiêu (tùy chọn)</label>
                    <select
                        id="strategy-target"
                        class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                    >
                        <option value="">Tất cả khách hàng</option>
                        <option value="khách hàng đam mê công nghệ">Tech Enthusiasts</option>
                        <option value="sinh viên và văn phòng">Sinh viên & Nhân viên văn phòng</option>
                        <option value="game thủ">Game thủ</option>
                        <option value="người dùng cao cấp">Khách hàng cao cấp</option>
                    </select>
                </div>
                <button
                    onclick="handleGenerateMarketingStrategy()"
                    id="gen-strategy-btn"
                    class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold hover:bg-indigo-700 transition-all active:scale-[0.98] shadow-lg shadow-indigo-100"
                >
                    <i data-lucide="target" class="w-4 h-4 inline-block mr-2"></i> Tạo chiến lược AI
                </button>
            </div>

            <div
                id="strategy-result"
                class="mt-6 p-5 bg-slate-50 rounded-2xl hidden text-sm whitespace-pre-line border border-slate-100 leading-relaxed shadow-inner prose prose-slate max-w-none"
            >
                <!-- Kết quả chiến lược sẽ hiển thị ở đây -->
            </div>
        </div>
    </div>
</div>
