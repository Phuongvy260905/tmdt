<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Banner Management</h2>
      <p class="text-sm text-slate-500 mt-1">
        Quản lý banner trang chủ, vị trí hiển thị và trạng thái.
      </p>
    </div>

    <button onclick="openBannerForm()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium">
      + Add Banner
    </button>
  </div>

  <div id="bannerGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></div>

  <div id="bannerFormBox" class="hidden mt-8 border border-slate-200 rounded-2xl p-5 bg-slate-50">
    <h3 class="text-lg font-semibold mb-4" id="bannerFormTitle">Add Banner</h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <input
        id="bannerTitle"
        type="text"
        placeholder="Tiêu đề banner"
        class="border border-slate-300 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
      >
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-2">Ảnh banner</label>

        <div
          id="bannerDropzone"
          class="border-2 border-dashed border-slate-300 rounded-2xl bg-white p-6 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all"
        >
          <input id="bannerUpload" type="file" accept="image/*" class="hidden" />

          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center">
              <i data-lucide="upload-cloud" class="w-6 h-6"></i>
            </div>

            <p class="text-sm font-medium text-slate-700">
              Kéo thả ảnh vào đây hoặc <span class="text-blue-600">bấm để chọn ảnh</span>
            </p>

            <p class="text-xs text-slate-400">
              Hỗ trợ JPG, PNG, WEBP
            </p>
          </div>
        </div>

        <input
          id="bannerImage"
          type="text"
          placeholder="Hoặc dán Image URL"
          class="mt-3 w-full border border-slate-300 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <input
        id="bannerTarget"
        type="text"
        placeholder="Target URL"
        class="border border-slate-300 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
      >
      <select
        id="bannerPosition"
        class="border border-slate-300 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="home-top">Đầu trang chủ</option>
        <option value="home-mid">Giữa trang chủ</option>
        <option value="home-bottom">Cuối trang chủ</option>
        <option value="sidebar-right">Sidebar phải</option>
        <option value="popup">Popup</option>
      </select>

      <input
        id="bannerSort"
        type="number"
        placeholder="Sort order"
        class="border border-slate-300 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
      >

      <select
        id="bannerActive"
        class="border border-slate-300 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option value="true">Đang bật</option>
        <option value="false">Đang tắt</option>
      </select>

    </div>

    <div id="bannerPreviewBox" class="mt-5 hidden">
      <p class="text-sm font-medium text-slate-700 mb-2">Preview ảnh</p>
      <div class="w-full md:w-[360px] h-44 rounded-2xl border border-slate-200 bg-white overflow-hidden">
        <img id="bannerPreviewImage" src="" class="w-full h-full object-cover">
      </div>
    </div>

    <div class="flex gap-3 mt-5">
      <button onclick="saveBanner()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl">
        Save
      </button>

      <button onclick="closeBannerForm()"
        class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-xl">
        Cancel
      </button>
    </div>
  </div>
</div>
