<div
  class="space-y-8 animate-in fade-in duration-700 mt-10"
  id="comments-section"
>
  <div
    class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4"
  >
    <div>
      <h2 class="text-2xl font-bold text-slate-800">
        Quản lý Bình luận & Đánh giá
      </h2>
      <p class="text-sm text-slate-500">
        Theo dõi phản hồi khách hàng và chất lượng sản phẩm
      </p>
    </div>

    <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
      <div class="relative">
        <i
          data-lucide="search"
          class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
        ></i>
        <input
          type="text"
          id="comment-search"
          placeholder="Tìm tên sản phẩm, khách..."
          class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-64"
          oninput="CommentModule.render()"
        />
      </div>

      <select
        id="rating-filter"
        onchange="CommentModule.render()"
        class="bg-white border border-slate-200 text-slate-600 text-sm rounded-lg p-2.5 outline-none font-medium shadow-sm"
      >
        <option value="all">Tất cả đánh giá</option>
        <option value="5">5 Sao ⭐⭐⭐⭐⭐</option>
        <option value="4">4 Sao ⭐⭐⭐⭐</option>
        <option value="3">3 Sao ⭐⭐⭐</option>
        <option value="2">2 Sao ⭐⭐</option>
        <option value="1">1 Sao ⭐</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <div
      class="glass-card p-5 rounded-2xl border border-blue-100 bg-white shadow-sm flex flex-col items-center justify-center text-center"
    >
      <p class="text-xs text-slate-500 font-bold uppercase mb-1">
        Điểm trung bình
      </p>
      <h3 class="text-3xl font-black text-blue-600">4.8</h3>
      <div class="flex gap-0.5 mt-2 text-amber-400">
        <i data-lucide="star" class="w-4 h-4 fill-current"></i>
        <i data-lucide="star" class="w-4 h-4 fill-current"></i>
        <i data-lucide="star" class="w-4 h-4 fill-current"></i>
        <i data-lucide="star" class="w-4 h-4 fill-current"></i>
        <i data-lucide="star" class="w-4 h-4 fill-current opacity-50"></i>
      </div>
    </div>
    <div
      class="glass-card p-4 rounded-xl border border-emerald-100 bg-emerald-50/30"
    >
      <div class="flex items-center gap-3">
        <div class="p-2 bg-emerald-100 text-emerald-600 rounded-lg">
          <i data-lucide="message-square" class="w-5 h-5"></i>
        </div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">
            Tổng bình luận
          </p>
          <h3 id="total-comments" class="text-xl font-bold text-slate-900">
            1,240
          </h3>
        </div>
      </div>
    </div>
    <div
      class="glass-card p-4 rounded-xl border border-amber-100 bg-amber-50/30"
    >
      <div class="flex items-center gap-3">
        <div class="p-2 bg-amber-100 text-amber-600 rounded-lg">
          <i data-lucide="alert-circle" class="w-5 h-5"></i>
        </div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">Chờ phản hồi</p>
          <h3 id="pending-reply" class="text-xl font-bold text-slate-900">
            14
          </h3>
        </div>
      </div>
    </div>
    <div class="glass-card p-4 rounded-xl border border-rose-100 bg-rose-50/30">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-rose-100 text-rose-600 rounded-lg">
          <i data-lucide="flag" class="w-5 h-5"></i>
        </div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">Bị báo cáo</p>
          <h3 id="reported-comments" class="text-xl font-bold text-slate-900">
            3
          </h3>
        </div>
      </div>
    </div>
  </div>

  <div
    class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden"
  >
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead
          class="bg-slate-50 text-slate-500 text-xs uppercase font-bold border-b border-slate-100"
        >
          <tr>
            <th class="px-6 py-4">Sản phẩm</th>
            <th class="px-6 py-4">Khách hàng</th>
            <th class="px-6 py-4">Đánh giá</th>
            <th class="px-6 py-4">Nội dung</th>
            <th class="px-6 py-4">Ngày</th>
            <th class="px-6 py-4 text-right">Thao tác</th>
          </tr>
        </thead>
        <tbody
          id="comment-table-body"
          class="divide-y divide-slate-100 text-sm"
        >
          <!-- Dữ liệu sẽ được JS render vào đây -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal giữ nguyên -->
<div
  id="comment-modal"
  class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
>
  <div
    class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden animate-in zoom-in duration-300"
  >
    <div class="p-6 border-b flex justify-between items-center bg-slate-50">
      <h3 class="text-xl font-bold text-slate-800">Chi tiết Đánh giá</h3>
      <button
        onclick="CommentModule.closeModal()"
        class="p-2 hover:bg-slate-200 rounded-full text-slate-400"
      >
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="p-8 space-y-6">
      <div class="flex items-center gap-4">
        <div
          class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center font-bold text-blue-600 text-lg"
          id="modal-avatar"
        ></div>
        <div>
          <h4 class="font-bold text-slate-800" id="modal-username"></h4>
          <p
            id="modal-product-name"
            class="text-sm text-blue-500 font-medium"
          ></p>
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider"
          >Đánh giá</label
        >
        <div class="flex text-amber-400 mt-1" id="modal-stars"></div>
      </div>

      <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
        <label class="text-xs font-bold text-slate-400 uppercase"
          >Nội dung bình luận</label
        >
        <p id="modal-text" class="text-slate-700 mt-1 leading-relaxed"></p>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-bold text-blue-600 uppercase"
          >Phản hồi của cửa hàng</label
        >
        <textarea
          id="admin-reply-text"
          rows="3"
          placeholder="Nhập phản hồi của bạn..."
          class="w-full p-4 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition"
        ></textarea>
      </div>
    </div>
    <div class="p-6 border-t bg-slate-50 flex gap-3 justify-end">
      <button
        onclick="CommentModule.deleteComment()"
        class="px-6 py-2.5 rounded-xl font-bold text-rose-600 hover:bg-rose-50 transition"
      >
        Ẩn/Xóa
      </button>
      <button
        onclick="CommentModule.submitReply()"
        class="px-6 py-2.5 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-200 transition"
      >
        Gửi phản hồi
      </button>
    </div>
  </div>
</div>

<script>
  // Kiểm tra mỗi 100ms xem table đã có dữ liệu chưa, nếu chưa thì render lại
  // Cách này đảm bảo kể cả khi bạn dùng AJAX để load nội dung vào tab thì nó vẫn hiện.
  const checkAndRender = setInterval(() => {
    const tbody = document.getElementById('comment-table-body');
    if (tbody && tbody.children.length === 0) {
      if (typeof CommentModule !== 'undefined') {
        CommentModule.init();
        clearInterval(checkAndRender);
      }
    } else if (tbody && tbody.children.length > 0) {
      clearInterval(checkAndRender);
    }
  }, 100);
</script>
