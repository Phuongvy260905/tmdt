<div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
  <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4 mb-8">
    <div>
      <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Category Management</h2>
      <p class="text-sm text-slate-500 mt-2">
        Quản lý danh mục, danh mục con, thứ tự hiển thị và trạng thái hoạt động.
      </p>
    </div>

    <button
      onclick="openCategoryForm()"
      class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-2xl font-medium shadow-sm transition-all"
    >
      <i data-lucide="plus" class="w-4 h-4"></i>
      <span>Add Category</span>
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
    <div class="lg:col-span-2 relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input
        id="categorySearch"
        type="text"
        placeholder="Tìm theo tên hoặc slug..."
        class="w-full border border-slate-300 rounded-2xl pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
      >
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
  <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
    <p class="text-sm text-slate-500">Tổng danh mục</p>
    <p id="categoryTotalCount" class="text-2xl font-bold text-slate-800 mt-1">0</p>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
    <p class="text-sm text-slate-500">Đang bật</p>
    <p id="categoryActiveCount" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
    <p class="text-sm text-slate-500">Danh mục con</p>
    <p id="categoryChildCount" class="text-2xl font-bold text-blue-600 mt-1">0</p>
  </div>
</div>

    <select
      id="categoryFilter"
      class="w-full border border-slate-300 rounded-2xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
    >
      <option value="all">Tất cả trạng thái</option>
      <option value="active">Đang bật</option>
      <option value="inactive">Đang tắt</option>
      <option value="root">Danh mục gốc</option>
      <option value="child">Danh mục con</option>
    </select>
  </div>

  <div id="categoryGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>

  <div id="categoryFormBox" class="hidden mt-8 border border-slate-200 rounded-3xl p-6 bg-slate-50">
    <h3 class="text-xl font-semibold text-slate-800 mb-5" id="categoryFormTitle">Add Category</h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Tên danh mục</label>
        <input
          id="categoryName"
          type="text"
          placeholder="Ví dụ: Điện thoại"
          class="w-full border border-slate-300 rounded-2xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Slug</label>
        <input
          id="categorySlug"
          type="text"
          placeholder="dien-thoai"
          class="w-full border border-slate-300 rounded-2xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Danh mục cha</label>
        <select
          id="categoryParent"
          class="w-full border border-slate-300 rounded-2xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Không có danh mục cha</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Sort order</label>
        <input
          id="categorySort"
          type="number"
          placeholder="1"
          class="w-full border border-slate-300 rounded-2xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-2">Trạng thái</label>
        <select
          id="categoryActive"
          class="w-full md:w-72 border border-slate-300 rounded-2xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="true">Đang bật</option>
          <option value="false">Đang tắt</option>
        </select>
      </div>
    </div>

    <div class="flex gap-3 mt-6">
      <button
        onclick="saveCategory()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-2xl font-medium"
      >
        Save
      </button>

      <button
        onclick="closeCategoryForm()"
        class="bg-white border border-slate-300 text-slate-700 px-5 py-3 rounded-2xl font-medium"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
