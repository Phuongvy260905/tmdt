<div class="space-y-6 animate-in fade-in duration-500">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-slate-800">Quản lý Đơn hàng</h2>
            <p class="text-sm text-slate-500">Theo dõi và xử lý đơn hàng từ hệ thống</p>
        </div>
        <div class="flex gap-2">
            <button onclick="OrdersModule.refresh()" class="p-2 bg-white border rounded-lg hover:bg-slate-50 transition active:scale-90">
                <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-600"></i>
            </button>
            <select id="order-filter" onchange="OrdersModule.filterOrders()" class="bg-white border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                <option value="all">Tất cả trạng thái</option>
                <option value="pending">Chờ xử lý</option>
                <option value="shipping">Đang giao</option>
                <option value="completed">Đã hoàn thành</option>
            </select>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left">
            <thead>
                <tr class="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold tracking-wider border-b">
                    <th class="px-6 py-4">Mã đơn</th>
                    <th class="px-6 py-4">Sản phẩm & Khách hàng</th>
                    <th class="px-6 py-4">Ngày đặt</th>
                    <th class="px-6 py-4">Tổng tiền</th>
                    <th class="px-6 py-4">Trạng thái</th>
                    <th class="px-6 py-4 text-right">Thao tác</th>
                </tr>
            </thead>
            <tbody id="order-table-body" class="divide-y divide-slate-100">
                </tbody>
        </table>
        
        <div id="order-loading" class="hidden py-10 text-center">
            <div class="ai-loading mb-2"></div>
            <p class="text-sm text-slate-400">Đang đồng bộ đơn hàng...</p>
        </div>
    </div>
</div>
