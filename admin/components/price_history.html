<div class="space-y-6 animate-in fade-in duration-500">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Lịch sử Biến động Giá</h2>
      <p class="text-sm text-slate-500">Theo dõi vết thay đổi giá, người thực hiện và lý do điều chỉnh</p>
    </div>
    
    <div class="flex gap-3 w-full md:w-auto">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input 
          type="text" 
          id="price-search" 
          placeholder="Tìm tên sản phẩm hoặc người sửa..." 
          class="pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full md:w-64"
          oninput="PriceHistoryModule.render()"
        >
      </div>
      <button onclick="PriceHistoryModule.refresh()" class="p-2 bg-white border rounded-xl hover:bg-slate-50 transition">
        <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-600"></i>
      </button>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold border-b">
          <tr>
            <th class="px-6 py-4">Thời điểm</th>
            <th class="px-6 py-4">Sản phẩm / Variant</th>
            <th class="px-6 py-4">Giá cũ</th>
            <th class="px-6 py-4">Giá mới</th>
            <th class="px-6 py-4">Người thay đổi</th>
            <th class="px-6 py-4">Lý do</th>
          </tr>
        </thead>
        <tbody id="price-history-table-body" class="divide-y divide-slate-100 text-sm text-slate-700">
          </tbody>
      </table>
    </div>
  </div>
</div>
