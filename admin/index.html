<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechAdmin - Hệ Thứng Quản Trị Shop Công Nghệ ✨</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 font-inter">
    <div class="flex h-screen overflow-hidden">
      <aside
        class="w-64 bg-slate-900 border-r border-slate-800 hidden md:flex flex-col shadow-xl text-slate-300"
      >
        <div class="p-6 border-b border-slate-800">
          <h1 class="text-2xl font-bold text-blue-500 flex items-center gap-2">
            <i data-lucide="cpu"></i> TechAdmin
          </h1>
          <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">
            Hệ thống quản trị công nghệ
          </p>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
          <button
            onclick="switchTab('dashboard')"
            id="btn-dashboard"
            class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="layout-dashboard"></i> <span>Tổng quan</span>
          </button>
          <button
            onclick="switchTab('products')"
            id="btn-products"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="smartphone"></i> <span>Kho thiết bị</span>
          </button>
          <button
            onclick="switchTab('marketing')"
            id="btn-marketing"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="zap"></i> <span> AI Marketing</span>
          </button>

          <button
            onclick="switchTab('orders')"
            id="btn-orders"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="shopping-cart"></i> <span>Đơn hàng</span>
          </button>
          <button
            onclick="switchTab('users')"
            id="btn-users"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="users"></i> <span>Users</span>
          </button>
          <button
            onclick="switchTab('categories')"
            id="btn-categories"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="layers-3"></i> <span>Categories</span>
          </button>

          <button
            onclick="switchTab('models')"
            id="btn-models"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="badge-info"></i> <span>Models</span>
          </button>

          <button
            onclick="switchTab('reviews')"
            id="btn-reviews"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="star"></i> <span>Reviews</span>
          </button>

          <button
            onclick="switchTab('settings')"
            id="btn-settings"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="settings-2"></i> <span>Settings</span>
          </button>

          <button
            onclick="switchTab('banners')"
            id="btn-banners"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="image"></i> <span>Banners</span>
          </button>

          <button
            onclick="switchTab('return')"
            id="btn-return"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="rotate-ccw"></i> <span>Return</span>
          </button>
          <button
            onclick="switchTab('comment')"
            id="btn-comment"
            class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-slate-800 text-left group"
          >
            <i data-lucide="messages-square"></i> <span>comment</span>
          </button>
        </nav>
        <div class="p-4 border-t border-slate-800">
          <div class="bg-slate-800 p-3 rounded-lg flex items-center gap-3">
            <div
              class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold text-white"
            >
              AD
            </div>
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white truncate">Admin Tech</p>
              <p class="text-[10px] text-slate-500">Root Access</p>
            </div>
          </div>
        </div>
      </aside>

      <div class="flex-1 flex flex-col overflow-hidden">
        <header
          class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10 shadow-sm"
        >
          <div class="flex items-center gap-4">
            <button class="md:hidden p-2 hover:bg-slate-100 rounded-full">
              <i data-lucide="menu"></i>
            </button>
            <div class="relative hidden sm:block">
              <span
                class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400"
              >
                <i data-lucide="search" class="w-4 h-4"></i>
              </span>
              <input
                type="text"
                id="global-search"
                placeholder="Tìm tên thiết bị, serial..."
                class="bg-slate-50 border border-slate-200 rounded-lg py-2 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 w-80 text-sm outline-none transition-all"
              />
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="h-8 w-px bg-slate-200 mx-2"></div>
            <button
              class="p-2 text-slate-500 hover:bg-slate-100 rounded-full relative"
            >
              <i data-lucide="bell" class="w-5 h-5"></i>
              <span
                class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"
              ></span>
            </button>
          </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8">
          <!-- Các tab content – sẽ được load động -->
          <div id="tab-dashboard" class="tab-content active">Loading...</div>
          <div id="tab-products" class="tab-content">Loading...</div>
          <div id="tab-marketing" class="tab-content">Loading...</div>
          <div id="tab-orders" class="tab-content">Loading...</div>
          <div id="tab-users" class="tab-content">Loading...</div>
          <div id="tab-categories" class="tab-content">Loading...</div>
          <div id="tab-models" class="tab-content">Loading...</div>
          <div id="tab-reviews" class="tab-content">Loading...</div>
          <div id="tab-settings" class="tab-content">Loading...</div>
          <div id="tab-banners" class="tab-content">Loading...</div>
          <div id="tab-return" class="tab-content">Loading...</div>
          <div id="tab-comment" class="tab-content">Loading...</div>
        </main>
      </div>

      <!-- Modal Add Product – copy nguyên -->
      <div
        id="add-product-modal"
        class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm"
      >
        <div
          class="bg-white rounded-3xl max-w-xl w-full p-8 shadow-2xl overflow-y-auto max-h-[90vh] animate-in zoom-in-95 duration-300"
        >
          <div
            class="flex justify-between items-center mb-8 border-b border-slate-100 pb-5"
          >
            <h3
              class="text-2xl font-bold text-slate-800 flex items-center gap-3"
            >
              <i data-lucide="plus-square" class="text-blue-600"></i> Nhập thiết
              bị mới
            </h3>
            <button
              onclick="toggleModal('add-product-modal')"
              class="text-slate-400 hover:text-slate-600 transition p-1 hover:bg-slate-100 rounded-lg"
            >
              <i data-lucide="x"></i>
            </button>
          </div>
          <form id="product-form" class="space-y-6">
            <!-- Nội dung modal – bạn có thể copy nguyên từ code gốc hoặc để trống tạm nếu chưa cần -->
            <!-- ... paste toàn bộ form add product từ code gốc vào đây ... -->
          </form>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/utils.js"></script>
    <script type="module" src="assets/js/api.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/marketing.js"></script>
    <script src="assets/js/orders.js"></script>
    <script src="assets/js/users.js"></script>
    <script src="assets/js/categories.js"></script>
    <script src="assets/js/models.js"></script>
    <script src="assets/js/reviews.js"></script>
    <script src="assets/js/settings.js"></script>
    <script src="assets/js/banners.js"></script>
    <script src="assets/js/return.js"></script>
    <script src="assets/js/comment.js"></script>

    <script>
      // Khởi tạo khi load
      window.addEventListener("DOMContentLoaded", async () => {
        lucide.createIcons();

        // Load các tab content động
        await loadTabContent("dashboard", "components/dashboard.html");
        await loadTabContent("products", "components/products.html");
        await loadTabContent("marketing", "components/marketing.html");
        await loadTabContent("orders", "components/orders.html");
        await loadTabContent("users", "components/users.html");
        await loadTabContent("categories", "components/categories.html");
        await loadTabContent("models", "components/models.html");
        await loadTabContent("reviews", "components/reviews.html");
        await loadTabContent("settings", "components/settings.html");
        await loadTabContent("banners", "components/banners.html");
        await loadTabContent("return", "components/return.html");
        await loadTabContent("comment", "components/comment.html");
        const savedTab = localStorage.getItem("activeTab") || "dashboard";

        // 3. Kích hoạt tab đó
        switchTab(savedTab);

        lucide.createIcons();

        if (typeof initCharts === "function") initCharts();
        if (typeof InventoryModule !== "undefined")
          InventoryModule.loadProducts();
        if (typeof OrdersModule !== "undefined") OrdersModule.loadOrders();
        // Nếu có thêm hàm init khác, gọi ở đây
      });

      async function loadTabContent(tabId, url) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`Không tải được ${url}`);
          const html = await res.text();
          document.getElementById(`tab-${tabId}`).innerHTML = html;
          lucide.createIcons(); // reload icon sau khi load nội dung mới
        } catch (err) {
          console.error(err);
          document.getElementById(`tab-${tabId}`).innerHTML =
            `<p class="text-red-500">Lỗi tải nội dung: ${err.message}</p>`;
        }
      }

      // 2. Hàm gắn sự kiện cho form (hỗ trợ cho InventoryModule)
      function initProductFormEvents() {
        const form = document.getElementById("add-product-form");
        if (form && typeof InventoryModule !== "undefined") {
          form.onsubmit = InventoryModule.handleAddProduct;
        }
      }

      // Hàm switchTab (nên nằm trong utils.js, nhưng nếu chưa có thì thêm tạm đây)
      lucide.createIcons();

      function switchTab(id) {
        localStorage.setItem("activeTab", id);
        document
          .querySelectorAll(".tab-content")
          .forEach((t) => t.classList.remove("active"));

        document
          .querySelectorAll(".sidebar-item")
          .forEach((b) => b.classList.remove("active"));

        document.getElementById(`tab-${id}`).classList.add("active");
        document.getElementById(`btn-${id}`).classList.add("active");

        lucide.createIcons();

        setTimeout(() => {
          if (id === "users" && typeof renderUsers === "function")
            renderUsers();
          if (id === "categories" && typeof renderCategories === "function")
            renderCategories();
          if (id === "models" && typeof renderModels === "function")
            renderModels();
          if (id === "reviews" && typeof renderReviews === "function")
            renderReviews();
          if (id === "settings" && typeof renderSettings === "function")
            renderSettings();
          if (id === "banners" && typeof renderBanners === "function")
            renderBanners();
          if (id === "return" && typeof CommentModule !== "undefined") {
            CommentModule.loadOrders();
          }
          if (id === "comment" && typeof CommentModule !== "undefined") {
            CommentModule.init();
          }
        }, 100);
      }
    </script>
  </body>
</html>
