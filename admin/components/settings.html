<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
  <div class="mb-5">
    <h2 class="text-2xl font-bold text-slate-800">Website Settings</h2>
    <p class="text-sm text-slate-500 mt-1">Quản lý hotline, Logo, Google Maps, Email, Địa chỉ.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <input id="settingHotline" type="text" placeholder="Hotline" class="border border-slate-300 rounded-xl px-4 py-2">
    <input id="settingLogo" type="text" placeholder="Logo URL" class="border border-slate-300 rounded-xl px-4 py-2">
    <input id="settingEmail" type="text" placeholder="Email liên hệ" class="border border-slate-300 rounded-xl px-4 py-2">
    <input id="settingAddress" type="text" placeholder="Địa chỉ cửa hàng" class="border border-slate-300 rounded-xl px-4 py-2">
  </div>

  <textarea id="settingMap" rows="5" placeholder="Google Maps iframe embed code"
    class="w-full mt-4 border border-slate-300 rounded-xl px-4 py-3"></textarea>

  <div class="mt-5 flex gap-3">
    <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl">
      Save Settings
    </button>
    <button onclick="renderSettings()" class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-xl">
      Reset
    </button>
  </div>

  <div class="mt-6 border border-slate-200 rounded-2xl p-4 bg-slate-50">
    <h3 class="font-semibold text-slate-800 mb-2">Map Preview</h3>
    <div id="mapPreview" class="text-sm text-slate-500"></div>
  </div>
</div>
