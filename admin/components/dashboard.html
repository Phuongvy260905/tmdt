<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<div class="space-y-8 animate-in fade-in duration-500">
  <div class="flex justify-between items-end">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Báo cáo Shop Công Nghệ</h2>
      <p class="text-sm text-slate-500">Dữ liệu cập nhật thời gian thực</p>
    </div>
    <div class="flex gap-2">
      <select
        id="time-range-selector"
        onchange="handleTimeRangeChange()"
        class="bg-white border border-slate-200 text-slate-600 text-sm rounded-lg px-3 py-2 outline-none font-bold shadow-sm"
      >
        <option value="week">So với tuần trước</option>
        <option value="month" selected>So với tháng trước</option>
        <option value="quarter">So với quý trước</option>
        <option value="year">So với năm trước</option>
      </select>
      <button
        onclick="handleAnalyzeData()"
        id="analyze-btn"
        class="flex items-center gap-2 text-blue-600 bg-white px-4 py-2 rounded-lg hover:bg-blue-50 transition font-bold border border-blue-200 shadow-sm"
      >
        <i data-lucide="brain-circuit" class="w-4 h-4"></i> Phân tích AI
      </button>
      <button
        onclick="handleInventoryForecast()"
        id="forecast-btn"
        class="flex items-center gap-2 text-emerald-600 bg-white px-4 py-2 rounded-lg hover:bg-emerald-50 transition font-bold border border-emerald-200 shadow-sm"
      >
        <i data-lucide="trending-up" class="w-4 h-4"></i> Dự báo linh kiện
      </button>
      <span
        id="compare-revenue-val"
        class="text-xs font-bold text-emerald-500 bg-emerald-50 px-2 py-1 rounded"
        >+12.5%</span
      >
      <p
        id="compare-revenue-label"
        class="text-[10px] text-slate-400 mt-1 uppercase"
      >
        so với tháng trước
      </p>
    </div>
  </div>

  <div
    id="ai-insights-container"
    class="hidden bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl"
  >
    <div class="flex items-center gap-2 mb-4 border-b border-slate-700 pb-3">
      <div class="p-2 bg-blue-500/20 rounded-lg">
        <i data-lucide="bot" class="text-blue-400 w-5 h-5"></i>
      </div>
      <h4 class="font-bold text-white text-sm uppercase tracking-widest italic">
        Tech-AI Insight Analysis
      </h4>
    </div>
    <div
      id="ai-insights-content"
      class="text-slate-300 text-sm leading-relaxed whitespace-pre-line"
    ></div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <div class="glass-card p-6 rounded-2xl shadow-sm">
      <div class="flex justify-between items-start mb-4">
        <div class="p-2 bg-blue-100 text-blue-600 rounded-lg">
          <i data-lucide="banknote"></i>
        </div>
        <span
          class="text-xs font-bold text-emerald-500 bg-emerald-50 px-2 py-1 rounded"
          >+12.5%</span
        >
      </div>
      <p class="text-sm text-slate-500 font-medium">Doanh thu Tech</p>
      <h3 id="stat-revenue" class="text-2xl font-bold text-slate-900 mt-1">
        2.450.000.000đ
      </h3>
    </div>

    <div class="glass-card p-6 rounded-2xl shadow-sm">
      <div class="flex justify-between items-start mb-4">
        <div class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">
          <i data-lucide="shopping-cart"></i>
        </div>
        <span
          class="text-xs font-bold text-emerald-500 bg-emerald-50 px-2 py-1 rounded"
          >+5%</span
        >
      </div>
      <p class="text-sm text-slate-500 font-medium">Đơn hàng mới</p>
      <h3 id="stat-orders" class="text-2xl font-bold text-slate-900 mt-1">
        1,248
      </h3>
    </div>
    <div class="glass-card p-6 rounded-2xl shadow-sm">
      <div class="flex justify-between items-start mb-4">
        <div class="p-2 bg-amber-100 text-amber-600 rounded-lg">
          <i data-lucide="users"></i>
        </div>
        <span
          class="text-xs font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded"
          >+18</span
        >
      </div>
      <p class="text-sm text-slate-500 font-medium">Khách hàng Tech</p>
      <h3 id="stat-customers" class="text-2xl font-bold text-slate-900 mt-1">
        8,420
      </h3>
    </div>
    <div class="glass-card p-6 rounded-2xl shadow-sm">
      <div class="flex justify-between items-start mb-4">
        <div class="p-2 bg-rose-100 text-rose-600 rounded-lg">
          <i data-lucide="shield-alert"></i>
        </div>
        <span
          class="text-xs font-bold text-rose-500 bg-rose-50 px-2 py-1 rounded"
          >-2.1%</span
        >
      </div>
      <p class="text-sm text-slate-500 font-medium">Tỉ lệ bảo hành</p>
      <h3 id="stat-cancel-rate" class="text-2xl font-bold text-slate-900 mt-1">
        1.4%
      </h3>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div
      class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-96"
    >
      <h3 class="font-bold text-slate-700 mb-6 flex items-center gap-2">
        <i data-lucide="line-chart" class="w-4 h-4 text-blue-500"></i> Biến động
        thị trường công nghệ
      </h3>
      <div class="h-[300px]">
        <canvas id="revenueChart"></canvas>
      </div>
    </div>
    <div
      class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-96"
    >
      <h3 class="font-bold text-slate-700 mb-6 flex items-center gap-2">
        <i data-lucide="pie-chart" class="w-4 h-4 text-blue-500"></i> Tỉ trọng
        ngành hàng
      </h3>
      <div class="h-[300px]">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>
  </div>
</div>
