<div class="space-y-8 animate-in fade-in duration-500">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Chiến dịch Khuyến mãi</h2>
      <p class="text-sm text-slate-500">Quản lý mã giảm giá và theo dõi hiệu suất sử dụng</p>
    </div>
    <button onclick="VoucherModule.openModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold transition shadow-lg shadow-blue-200">
      <i data-lucide="plus-circle" class="w-5 h-5"></i> Tạo mã mới
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center gap-4">
      <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="ticket" class="w-6 h-6"></i></div>
      <div>
        <p class="text-xs text-slate-500 font-bold uppercase">Mã đang chạy</p>
        <h3 id="active-vouchers-count" class="text-2xl font-bold text-slate-800">0</h3>
      </div>
    </div>
    <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center gap-4">
      <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><i data-lucide="user-check" class="w-6 h-6"></i></div>
      <div>
        <p class="text-xs text-slate-500 font-bold uppercase">Tổng lượt dùng</p>
        <h3 id="total-usages" class="text-2xl font-bold text-slate-800">0</h3>
      </div>
    </div>
    <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center gap-4">
      <div class="p-3 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="clock" class="w-6 h-6"></i></div>
      <div>
        <p class="text-xs text-slate-500 font-bold uppercase">Sắp hết hạn</p>
        <h3 class="text-2xl font-bold text-slate-800">2</h3>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold border-b">
          <tr>
            <th class="px-6 py-4">Mã Voucher</th>
            <th class="px-6 py-4">Loại giảm giá</th>
            <th class="px-6 py-4">Điều kiện tối thiểu</th>
            <th class="px-6 py-4">Sử dụng / Giới hạn</th>
            <th class="px-6 py-4">Trạng thái</th>
            <th class="px-6 py-4 text-right">Thao tác</th>
          </tr>
        </thead>
        <tbody id="voucher-table-body" class="divide-y divide-slate-100 text-sm text-slate-700">
          </tbody>
      </table>
    </div>
  </div>
</div>

<div id="voucher-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-xl overflow-hidden animate-in zoom-in duration-300">
    <form id="voucher-form" onsubmit="VoucherModule.handleSubmit(event)">
      <div class="p-6 border-b flex justify-between items-center bg-slate-50">
        <h3 id="modal-title" class="text-xl font-bold text-slate-800">Tạo Voucher Mới</h3>
        <button type="button" onclick="VoucherModule.closeModal()" class="p-2 hover:bg-slate-200 rounded-full text-slate-400"><i data-lucide="x"></i></button>
      </div>
      <div class="p-8 grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mã Voucher (Ví dụ: TECHSUMMER2026)</label>
          <input type="text" id="v-code" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 uppercase">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Loại giảm</label>
          <select id="v-type" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
            <option value="percentage">Phần trăm (%)</option>
            <option value="fixed">Số tiền cố định (đ)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mức giảm</label>
          <input type="number" id="v-value" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Giảm tối đa</label>
          <input type="number" id="v-max" class="w-full p-3 bg-slate-50 border rounded-xl outline-none" placeholder="Để trống nếu không giới hạn">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Đơn tối thiểu</label>
          <input type="number" id="v-min" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Giới hạn lượt dùng</label>
          <input type="number" id="v-limit" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Ngày hết hạn</label>
          <input type="date" id="v-expiry" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
        </div>
      </div>
      <div class="p-6 border-t bg-slate-50 flex justify-end gap-3">
        <button type="button" onclick="VoucherModule.closeModal()" class="px-6 py-2.5 rounded-xl font-bold text-slate-500">Huỷ</button>
        <button type="submit" class="px-6 py-2.5 rounded-xl font-bold bg-blue-600 text-white shadow-lg shadow-blue-200">Lưu Voucher</button>
      </div>
    </form>
  </div>
</div>
